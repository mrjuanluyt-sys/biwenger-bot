app = "biwenger-van-nistelrooy"
primary_region = "mad"

[build]

[env]
  PYTHONUNBUFFERED = "1"
  PORT = "8080"
  DAILY_BRIEFING_HOUR = "10"
  BIWENGER_APP_VERSION = "631"
  BIWENGER_COMPETITION = "la-liga"
  BIWENGER_LEAGUE_ID = "145412"
  BIWENGER_USER_ID = "604336"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

[mounts]
  source = "biwenger_data"
  destination = "/app/data"
